<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select City</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;background:#F8F3E2}
a{color:#16325A}a:hover{color:#16325A}
.citycard{position:relative;border:none;background:#FBECCD;border-radius:18px;overflow:hidden;padding:0;cursor:pointer;height:150px;font-family:inherit;transition:transform .2s,box-shadow .25s}
.citycard:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(22,50,90,.18)}
.citycard:active{transform:scale(.97)}
.badge{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.cta{border:none;cursor:pointer;transition:transform .15s,box-shadow .2s;animation:rise .35s ease}
.cta:hover{box-shadow:0 8px 20px rgba(17,44,74,.3)}
.cta:active{transform:scale(.97)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.search{width:100%;height:46px;box-sizing:border-box;border:1.5px solid #EFE2C4;border-radius:999px;background:#FFFFFF;padding:0 18px 0 44px;font-family:inherit;font-size:14px;font-weight:600;color:#16325A;outline:none;transition:border-color .25s,box-shadow .25s}
.search::placeholder{color:#8A94A8}
.search:focus{border-color:#16325A;box-shadow:0 0 0 3px rgba(22,50,90,.12)}
@media (prefers-reduced-motion: reduce){.badge,.cta{animation:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 744px; box-sizing: border-box; font-family: 'Nunito', system-ui, sans-serif; color: #16325A; display: flex; flex-direction: column; padding: 22px 22px 24px; background: linear-gradient(180deg, #D9E7F1 0%, #F8F3E2 170px)">
  <div style="display: flex; align-items: flex-start; gap: 8px">
    <button aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; border: none; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1 style="margin: 2px 40px 0 0; flex: 1; font-size: 27px; font-weight: 800; text-align: center; line-height: 1.22; letter-spacing: -0.3px">Pick Your<br>Adventure City</h1>
  </div>
  <div style="position: relative; margin-top: 18px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 14px"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input class="search" type="search" aria-label="Search cities" placeholder="Search cities..." value="{{q}}" onChange="{{onSearch}}">
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px">
    <sc-for list="{{cities}}" as="c" hint-placeholder-count="6">
      <button class="citycard" style="{{c.ring}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">
        <img src="{{c.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(180deg, rgba(12,24,44,0) 0%, rgba(12,24,44,.78) 100%)"></span>
        <span style="position: absolute; left: 14px; bottom: 11px; color: #FFFFFF; font-size: 15px; font-weight: 800; text-shadow: 0 1px 3px rgba(10,20,40,.5)">{{c.label}}</span>
        <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
          <span class="badge" style="background: {{accent}}">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFF7E6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{noMatch}}" hint-placeholder-val="{{false}}">
    <p style="margin: 26px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: #54627E">No cities match that yet. New cities are on the way!</p>
  </sc-if>
  <div style="margin-top: auto; padding-top: 20px; min-height: 74px; box-sizing: border-box">
    <sc-if value="{{hasPick}}" hint-placeholder-val="{{false}}">
      <button class="cta" style="width: 100%; height: 54px; border-radius: 999px; background: #112C4A; color: #FFF7E6; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
        <span>{{ctaLabel}}</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF7E6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#16325A","options":["#16325A","#3E8E5B","#E8862B","#D94F4F"]},"$preview":{"width":390,"height":744}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#16325A';
    const q = ((this.state && this.state.q) || '').toLowerCase();
    const picked = (this.state && this.state.picked) || '';
    const defs = [
      { id: 'amsterdam', label: 'Amsterdam', img: '/_blob/bd900918a1155fb7ccc80ce0a3ca54a3' },
      { id: 'paris', label: 'Paris', img: '/_blob/820d0dc491a89c95747a0b0e53e60e13' },
      { id: 'london', label: 'London', img: '/_blob/0da769ad55668e863c594ed33ab637c9' },
      { id: 'newyork', label: 'New York', img: '/_blob/5d3305d3d7d0c30e096a929e4ab9afea' },
      { id: 'barcelona', label: 'Barcelona', img: '/_blob/63904850836dfb821cd24d67a3b03ba2' },
      { id: 'tokyo', label: 'Tokyo', img: '/_blob/9b716158362d242631a91a169819cc31' }
    ];
    const vis = defs.filter((d) => q === '' || d.label.toLowerCase().indexOf(q) >= 0);
    const cities = vis.map((d) => {
      const on = picked === d.id;
      return {
        label: d.label,
        img: d.img,
        on: on,
        ring: on ? 'box-shadow: 0 0 0 3px ' + accent + ', 0 10px 22px rgba(22,50,90,.2)' : '',
        pick: () => this.setState({ picked: on ? '' : d.id })
      };
    });
    const pickedDef = defs.filter((d) => d.id === picked)[0];
    return {
      accent: accent,
      q: (this.state && this.state.q) || '',
      onSearch: (e) => this.setState({ q: e.target.value }),
      cities: cities,
      noMatch: vis.length === 0,
      hasPick: !!pickedDef,
      ctaLabel: pickedDef ? 'Explore ' + pickedDef.label : ''
    };
  }
}
</script>
</body>
</html>
