<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;background:#F8F3E2}
a{color:#16325A;text-decoration:none}a:hover{color:#16325A}
.setrow{display:flex;align-items:center;gap:14px;background:none;border:none;padding:15px 16px;width:100%;box-sizing:border-box;cursor:pointer;font-family:inherit;transition:background .2s}
.setrow:hover{background:#FFFFFF}
.setrow:active{background:#F3ECD9}
.divider{height:1.5px;background:#EFE2C4;margin:0 16px}
.confirmbtn{border:none;border-radius:999px;height:44px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;flex:1;transition:transform .15s}
.confirmbtn:active{transform:scale(.96)}
.backbtn{width:40px;height:40px;border-radius:999px;border:1.5px solid #EFE2C4;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</helmet>
<div style="width: 390px; min-height: 640px; box-sizing: border-box; background: #F8F3E2; font-family: 'Nunito', system-ui, sans-serif; color: #16325A; display: flex; flex-direction: column; padding: 22px 22px 24px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a class="backbtn" href="Main.dc.html" aria-label="Back to Profile">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <h1 style="margin: 0; flex: 1; margin-right: 48px; font-size: 23px; font-weight: 800; text-align: center; letter-spacing: -0.3px">Settings</h1>
  </div>
  <div style="border: 2px solid #EFE2C4; background: #FCF7EA; border-radius: 18px; margin-top: 20px; overflow: hidden">
    <button class="setrow">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 800">Edit Profile</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54627E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="divider"></div>
    <button class="setrow">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="#FCF7EA"></circle><circle cx="15" cy="12" r="2" fill="#FCF7EA"></circle><circle cx="7" cy="18" r="2" fill="#FCF7EA"></circle></svg>
      <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 800">Preferences</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54627E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="divider"></div>
    <button class="setrow">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 800">Notifications</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54627E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="divider"></div>
    <button class="setrow">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 800">Help &amp; Support</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54627E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="divider"></div>
    <button class="setrow">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 800">About</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#54627E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
  <div style="border: 2px solid #EFE2C4; background: #FCF7EA; border-radius: 18px; margin-top: 16px; overflow: hidden">
    <sc-if value="{{asking}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px">
        <span style="flex: 1; font-size: 13.5px; font-weight: 800">Log out of your account?</span>
        <button class="confirmbtn" onClick="{{confirmOut}}" style="background: #C8403A; color: #FFF7E6; max-width: 92px">Log Out</button>
        <button class="confirmbtn" onClick="{{cancelOut}}" style="background: #EDE4CC; color: #16325A; max-width: 92px">Cancel</button>
      </div>
    </sc-if>
    <sc-if value="{{resting}}" hint-placeholder-val="{{true}}">
      <button class="setrow" onClick="{{askOut}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8403A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 800; color: #C8403A">Log Out</span>
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const asking = !!(this.state && this.state.asking);
    return {
      asking: asking,
      resting: !asking,
      askOut: () => this.setState({ asking: true }),
      cancelOut: () => this.setState({ asking: false }),
      confirmOut: () => this.setState({ asking: false })
    };
  }
}
</script>
</body>
</html>
