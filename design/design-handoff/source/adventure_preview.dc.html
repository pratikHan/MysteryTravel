<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adventure Preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;background:#F8F3E2}
a{color:#16325A;text-decoration:none}a:hover{color:#16325A}
.kenburns{animation:kb 11s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.cta{border:none;cursor:pointer;transition:transform .15s,box-shadow .2s}
.cta:hover{box-shadow:0 8px 20px rgba(17,44,74,.3)}
.cta:active{transform:scale(.97)}
.backbtn{width:40px;height:40px;border-radius:999px;border:1.5px solid #EFE2C4;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
@media (prefers-reduced-motion: reduce){.kenburns{animation:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 700px; box-sizing: border-box; background: #F8F3E2; font-family: 'Nunito', system-ui, sans-serif; color: #16325A; display: flex; flex-direction: column; padding: 22px 22px 24px">
  <div style="display: flex; align-items: center; gap: 8px">
    <button class="backbtn" aria-label="Back">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1 style="margin: 0; flex: 1; margin-right: 48px; font-size: 23px; font-weight: 800; text-align: center; letter-spacing: -0.3px">Adventure Preview</h1>
  </div>
  <p style="margin: 8px 0 0; font-size: 14px; font-weight: 700; text-align: center; line-height: 1.4; color: #54627E">Here&rsquo;s a sneak peek<br>of your journey!</p>
  <div style="margin-top: 16px; border-radius: 20px; overflow: hidden; box-shadow: 0 6px 18px rgba(22,50,90,.14); flex: none">
    <img class="kenburns" src="/_blob/d7867cb07d25ad2770def8b2d078ff00" alt="Illustrated map of the journey with numbered stops and the explorer mascot" style="width: 100%; height: 392px; object-fit: cover; display: block">
  </div>
  <div style="margin-top: auto; padding-top: 22px">
    <button class="cta" onClick="{{go}}" style="width: 100%; height: 54px; border-radius: 999px; background: #112C4A; color: #FFF7E6; font-family: inherit; font-size: 16px; font-weight: 800">Start Adventure</button>
    <sc-if value="{{started}}" hint-placeholder-val="{{false}}">
      <p style="margin: 10px 0 0; text-align: center; font-size: 12px; font-weight: 700; color: #54627E">The Adventure Path screen picks up from here.</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      started: !!(this.state && this.state.started),
      go: () => this.setState({ started: true })
    };
  }
}
</script>
</body>
</html>
