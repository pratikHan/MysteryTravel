<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Achievements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;background:#F8F3E2}
a{color:#16325A;text-decoration:none}a:hover{color:#16325A}
.achrow{display:flex;align-items:center;gap:13px;border:2px solid #EFE2C4;background:#FCF7EA;border-radius:16px;padding:13px 15px;width:100%;box-sizing:border-box;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .25s}
.achrow:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(22,50,90,.1)}
.achrow.locked:active{animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bar{height:12px;border-radius:999px;background:#EDE4CC;overflow:hidden}
.fill{height:100%;border-radius:999px;background:#5BA85F;animation:grow 1s ease-out}
@keyframes grow{from{width:0}}
.backbtn{width:40px;height:40px;border-radius:999px;border:1.5px solid #EFE2C4;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
@media (prefers-reduced-motion: reduce){.fill,.achrow.locked:active{animation:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 690px; box-sizing: border-box; background: #F8F3E2; font-family: 'Nunito', system-ui, sans-serif; color: #16325A; display: flex; flex-direction: column; padding: 22px 22px 24px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a class="backbtn" href="Main.dc.html" aria-label="Back to Profile">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <div style="flex: 1; margin-right: 40px; text-align: center">
      <h1 style="margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -0.3px">Achievements</h1>
      <div style="font-size: 12.5px; font-weight: 700; color: #54627E; margin-top: 2px">6/20 unlocked</div>
    </div>
  </div>
  <div class="bar" style="margin-top: 14px"><div class="fill" style="width: 30%"></div></div>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 18px">
    <sc-for list="{{items}}" as="a" hint-placeholder-count="5">
      <button class="achrow {{a.cls}}" style="{{a.dim}}">
        <span style="width: 42px; height: 42px; border-radius: 999px; background: #FAEBD0; border: 1.5px solid #EFD9AC; display: flex; align-items: center; justify-content: center; flex: none">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#E8A73C" stroke="#C9872A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"></circle><polygon points="12 6 12.95 7.9 15 8.2 13.5 9.7 13.85 11.8 12 10.8 10.15 11.8 10.5 9.7 9 8.2 11.05 7.9"></polygon><path d="M8.5 14.5L7 21l5-2.8L17 21l-1.5-6.5" fill="#E8A73C"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left">
          <span style="font-size: 14.5px; font-weight: 800">{{a.title}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #54627E">{{a.sub}}</span>
        </span>
        <sc-if value="{{a.done}}" hint-placeholder-val="{{true}}">
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #5BA85F; display: flex; align-items: center; justify-content: center; flex: none">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
        </sc-if>
        <sc-if value="{{a.lock}}" hint-placeholder-val="{{false}}">
          <span style="width: 26px; height: 26px; border-radius: 999px; background: #EDE4CC; display: flex; align-items: center; justify-content: center; flex: none">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8468" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":690}}'>
class Component extends DCLogic {
  renderVals() {
    const defs = [
      { title: 'First Adventure', sub: 'Complete your first adventure', done: true },
      { title: 'Foodie Explorer', sub: 'Complete 3 food adventures', done: false },
      { title: 'Culture Seeker', sub: 'Visit 5 cultural locations', done: false },
      { title: 'Stamp Collector', sub: 'Collect 10 stamps', done: false },
      { title: 'City Hopper', sub: 'Explore 3 different cities', done: false }
    ];
    return {
      items: defs.map((d) => ({
        title: d.title, sub: d.sub,
        done: d.done, lock: !d.done,
        cls: d.done ? '' : 'locked',
        dim: d.done ? '' : 'opacity: .82'
      }))
    };
  }
}
</script>
</body>
</html>
