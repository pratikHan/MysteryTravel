<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customize Adventure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
body{margin:0;background:#F8F3E2}
a{color:#16325A}a:hover{color:#16325A}
.moderow{display:flex;align-items:center;gap:14px;border:2px solid #EFE2C4;background:#FCF7EA;border-radius:16px;padding:14px 16px;cursor:pointer;font-family:inherit;text-align:left;width:100%;box-sizing:border-box;transition:border-color .25s,background .25s,transform .15s,box-shadow .25s}
.moderow:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(22,50,90,.1)}
.moderow:active{transform:scale(.98)}
.radio{width:22px;height:22px;border-radius:999px;border:2.5px solid #B9BFCB;flex:none;display:flex;align-items:center;justify-content:center;transition:border-color .25s;box-sizing:border-box}
.dot{width:11px;height:11px;border-radius:999px;animation:pop .25s ease}
.styletile{border:2px solid #EFE2C4;background:#FCF7EA;border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-family:inherit;transition:border-color .25s,background .25s,transform .15s,box-shadow .25s}
.styletile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(22,50,90,.1)}
.styletile:active{transform:scale(.96)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.cta{border:none;cursor:pointer;transition:transform .15s,box-shadow .2s}
.cta:hover{box-shadow:0 8px 20px rgba(17,44,74,.3)}
.cta:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.dot{animation:none}.moderow,.styletile{transition:none}}
</style>
</helmet>
<div style="width: 390px; min-height: 700px; box-sizing: border-box; background: #F8F3E2; font-family: 'Nunito', system-ui, sans-serif; color: #16325A; display: flex; flex-direction: column; padding: 22px 22px 24px">
  <div style="display: flex; align-items: flex-start; gap: 8px">
    <button aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid #EFE2C4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16325A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div style="flex: 1; margin-right: 40px">
      <h1 style="margin: 2px 0 0; font-size: 26px; font-weight: 800; text-align: center; line-height: 1.22; letter-spacing: -0.3px">Customize<br>Your Adventure</h1>
      <p style="margin: 6px 0 0; font-size: 14px; font-weight: 700; text-align: center; color: #54627E">Make it your own!</p>
    </div>
  </div>
  <h2 style="margin: 22px 0 0; font-size: 17px; font-weight: 800">Adventure Mode</h2>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button class="moderow" style="{{m.ring}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}">
        <span class="radio" style="{{m.radioStyle}}">
          <sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><span class="dot" style="background: {{accent}}"></span></sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 800">{{m.label}}</span>
          <span style="font-size: 12.5px; font-weight: 600; color: #54627E">{{m.sub}}</span>
        </span>
      </button>
    </sc-for>
  </div>
  <h2 style="margin: 22px 0 0; font-size: 17px; font-weight: 800">Travel Style</h2>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px">
    <sc-for list="{{styles}}" as="s" hint-placeholder-count="4">
      <button class="styletile" style="{{s.ring}}" onClick="{{s.pick}}" aria-pressed="{{s.on}}">
        <sc-if value="{{flatIcons}}" hint-placeholder-val="{{true}}">
          <span style="width: 44px; height: 44px; border-radius: 14px; background: {{s.tint}}; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{s.hue}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="8" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 4.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
        </sc-if>
        <sc-if value="{{avatarIcons}}" hint-placeholder-val="{{false}}">
          <img src="{{s.img}}" alt="" style="width: 50px; height: 44px; object-fit: cover; border-radius: 12px; display: block">
        </sc-if>
        <span style="font-size: 12px; font-weight: 800">{{s.label}}</span>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: auto; padding-top: 22px">
    <button class="cta" onClick="{{go}}" style="width: 100%; height: 54px; border-radius: 999px; background: #112C4A; color: #FFF7E6; font-family: inherit; font-size: 16px; font-weight: 800">Preview Adventure</button>
    <sc-if value="{{previewed}}" hint-placeholder-val="{{false}}">
      <p style="margin: 10px 0 0; text-align: center; font-size: 12px; font-weight: 700; color: #54627E">{{summary}}</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#16325A","options":["#16325A","#3E8E5B","#E8862B","#D94F4F"]},"illustratedAvatars":{"editor":"boolean","default":false},"$preview":{"width":390,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#16325A';
    const avatars = !!(this.props.illustratedAvatars ?? false);
    const mode = (this.state && this.state.mode) || 'classic';
    const style = (this.state && this.state.style) || 'solo';
    const modeDefs = [
      { id: 'classic', label: 'Classic', sub: 'Balanced clues' },
      { id: 'challenging', label: 'Challenging', sub: 'Fewer hints' },
      { id: 'relaxed', label: 'Relaxed', sub: 'More guidance' }
    ];
    const modes = modeDefs.map((d) => {
      const on = mode === d.id;
      return {
        label: d.label, sub: d.sub, on: on,
        ring: on ? 'border-color: ' + accent + '; background: #FFFFFF' : '',
        radioStyle: on ? 'border-color: ' + accent : '',
        pick: () => this.setState({ mode: d.id })
      };
    });
    const styleDefs = [
      { id: 'solo', label: 'Solo', hue: '#4A7FC9', tint: '#E3EDF8', img: '/_blob/d5796419c84990f5b225178f26f77603' },
      { id: 'couple', label: 'Couple', hue: '#D4584E', tint: '#FAE4E0', img: '/_blob/b102de4a447e9998a7b498a6beb191c9' },
      { id: 'friends', label: 'Friends', hue: '#8A4FD3', tint: '#EFE6FA', img: '/_blob/f4c0b6b1111779b79228f7dbc61caf03' },
      { id: 'family', label: 'Family', hue: '#CE7A1F', tint: '#FAEBD6', img: '/_blob/419da6d102ed123d116cfef9ffdf83e1' }
    ];
    const styles = styleDefs.map((d) => {
      const on = style === d.id;
      return {
        label: d.label, hue: d.hue, tint: d.tint, img: d.img, on: on,
        ring: on ? 'border-color: ' + accent + '; background: #FFFFFF; box-shadow: 0 6px 14px rgba(22,50,90,.12)' : '',
        pick: () => this.setState({ style: d.id })
      };
    });
    const modeLabel = modeDefs.filter((d) => d.id === mode)[0].label;
    const styleLabel = styleDefs.filter((d) => d.id === style)[0].label;
    return {
      accent: accent,
      flatIcons: !avatars,
      avatarIcons: avatars,
      modes: modes,
      styles: styles,
      previewed: !!(this.state && this.state.previewed),
      go: () => this.setState({ previewed: true }),
      summary: modeLabel + ' mode, ' + styleLabel.toLowerCase() + ' — the Adventure Preview screen comes next.'
    };
  }
}
</script>
</body>
</html>
